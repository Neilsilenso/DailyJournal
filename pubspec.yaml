name: daily_journal_app
description: A Daily Journal App for SDPD Assignment.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter


  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  cloud_firestore: ^6.1.0
  provider: ^6.1.5+1
  intl: ^0.20.2
  flutter_spinkit: ^5.2.2
  fluttertoast: ^9.0.0

  # Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.14.4
flutter_launcher_icons:
    android: true
    ios: true
    image_path: "assets/logo/Minimalistic Cobalt Blue 'J' Logo with Shadow (1).png"
    remove_alpha_ios: true

flutter:
  uses-material-design: true
