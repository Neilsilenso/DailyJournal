name: daily_journal_app
description: A Daily Journal App for SDPD Assignment.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter


  # Firebase Core - REQUIRED
  firebase_core: ^2.24.2

  # Firebase Authentication
  firebase_auth: ^4.15.3

  # Cloud Firestore Database
  cloud_firestore: ^4.13.6

  # State Management
  provider: ^6.1.1

  # Date/Time Formatting
  intl: ^0.18.1

  # Loading Indicators
  flutter_spinkit: ^5.2.0

  # Toast Messages
  fluttertoast: ^8.2.4

  # Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
